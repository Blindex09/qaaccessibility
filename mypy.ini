[mypy]
python_version = 3.11
warn_unused_configs = True
explicit_package_bases = True

# python-docx (import name: docx) ships no type stubs and no py.typed marker,
# and no types-python-docx package exists on PyPI to install.
[mypy-docx.*]
ignore_missing_imports = True

# Optional soft-dependency: context_compressor.py imports this inside a
# try/except ImportError and works fine without it -- no stubs exist for it.
[mypy-headroom]
ignore_missing_imports = True

# weasyprint (PDF rendering) ships no py.typed marker and no types-weasyprint
# package exists on PyPI to install.
[mypy-weasyprint]
ignore_missing_imports = True
