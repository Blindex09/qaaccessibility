[pytest]
asyncio_mode = auto
testpaths = tests/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=backend/src --cov-report=term-missing
markers =
    real_llm: chama um provider LLM real (Ollama Cloud) -- opt-in, requer RUN_REAL_LLM_TESTS=1 e OLLAMA_API_KEY
