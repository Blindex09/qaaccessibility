[pytest]
asyncio_mode = auto
testpaths = tests/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --cov=backend/src --cov-report=term-missing
markers =
    real_llm: evals opt-in (RUN_REAL_LLM_TESTS=1), REAL_LLM_PROVIDER=ollama-cloud ou factory e chave correspondente
