name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # A suíte nunca deve depender de um .env local nem tocar no cofre DPAPI real.
  SECRET_KEY: ci-secret-key-not-used-in-production
  # Desligado por padrão: os testes `real_llm` chamam um provider LLM pago e
  # exigem credencial. São opt-in, não fazem parte do gate de CI.
  RUN_REAL_LLM_TESTS: "0"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar ruff
        run: pip install "ruff>=0.4.4"

      - name: ruff check
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: mypy
        run: mypy --config-file mypy.ini backend/src

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar bibliotecas nativas do WeasyPrint
        # Pango/GObject/cairo são carregados por FFI na geração de PDF/UA-1.
        # Sem elas os testes de PDF se auto-pulam; com elas rodam de verdade.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libcairo2

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: pytest
        # pytest.ini já aplica --cov=backend/src --cov-report=term-missing.
        run: pytest
