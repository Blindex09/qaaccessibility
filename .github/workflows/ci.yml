name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo branch/PR quando um novo push chega.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # A suíte nunca deve depender de um .env local nem tocar no cofre DPAPI real.
  SECRET_KEY: ci-secret-key-not-used-in-production
  # Desligado por padrão: os testes `real_llm` chamam um provider LLM pago e
  # exigem credencial. São opt-in, não fazem parte do gate de CI.
  RUN_REAL_LLM_TESTS: "0"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar ruff
        run: pip install "ruff>=0.4.4"

      - name: ruff check
        run: ruff check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: mypy
        run: mypy --config-file mypy.ini backend/src

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar bibliotecas nativas do WeasyPrint
        # Pango/GObject/cairo são carregados por FFI na geração de PDF/UA-1.
        # Sem elas os testes de PDF se auto-pulam; com elas rodam de verdade.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 libcairo2

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: pytest
        # pytest.ini já aplica --cov=backend/src --cov-report=term-missing.
        run: pytest

  web:
    name: Web (lint, tipos, testes, Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # web/.npmrc fixa legacy-peer-deps: @expo/webpack-config@19 declara peer
      # expo ^49||^50 e este app está no 51. Sem isso o install aborta inteiro.
      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      # Sem --passWithNoTests: um jest que não acha teste nenhum tem de falhar,
      # não passar em silêncio. Aqui vivem os testes de acessibilidade da
      # própria interface -- contraste dos tokens, alvo de toque, live region,
      # foco de diálogo e a aprovação inline que libera mutação de código.
      - name: Jest
        run: npm run test:ci

      - name: Build web
        run: npx expo export:web

      # Auditoria de acessibilidade do build recém-gerado (não do artefato
      # versionado em web/web-build, que pode estar velho). Falha abaixo de
      # 0.9 em acessibilidade. Roda headless, sem extensão de browser.
      - name: Lighthouse CI (acessibilidade)
        run: npm run a11y:lighthouse

      - name: Publicar relatório do Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: web/.lighthouseci/
          if-no-files-found: ignore
