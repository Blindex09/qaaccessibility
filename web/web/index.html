<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- WCAG 1.4.4 Resize Text: must allow user scaling (maximum-scale >= 2) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <title>QA Accessibility — Auditoria de Acessibilidade com IA</title>
    <meta name="description" content="Ferramenta profissional de auditoria de acessibilidade web. Analise páginas, arquivos e projetos inteiros contra WCAG 2.2, WAI-ARIA e ADA Section 508 usando inteligência artificial." />
    <meta name="theme-color" content="#0B1120" />

    <!-- ─── Google Fonts ─────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ─── CSS Design Tokens ─────────────────────────────────── */
      :root {
        --color-bg-root: #0B1120;
        --color-bg-surface: #111827;
        --color-bg-elevated: #1E293B;
        --color-text-primary: #F1F5F9;
        --color-text-secondary: #94A3B8;
        --color-accent: #14B8A6;
        --color-accent-hover: #0D9488;
        --color-border: #1E293B;
        --color-border-strong: #334155;
        --color-focus: #14B8A6;
        --font-display: 'Plus Jakarta Sans', sans-serif;
        --font-body: 'DM Sans', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --radius-md: 10px;
        --radius-lg: 14px;
        --shadow-glow: 0 0 20px rgba(20, 184, 166, 0.15);
      }

      /* ─── Base Reset ────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--color-bg-root);
        color: var(--color-text-primary);
        font-family: var(--font-body);
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      html {
        scroll-behavior: smooth;
        height: calc(100% + env(safe-area-inset-top));
        /* WCAG 1.4.12 Text Spacing: support custom spacing */
      }

      body {
        display: flex;
        overflow-y: auto;
        overscroll-behavior-y: none;
        -ms-overflow-style: scrollbar;
        -webkit-overflow-scrolling: touch;
      }

      /* Ambient teal spotlight — memorable visual anchor */
      body::after {
        content: '';
        position: fixed;
        top: -120px;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 400px;
        background: radial-gradient(ellipse at center, rgba(20,184,166,0.07) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }

      #root {
        flex-shrink: 0;
        flex-basis: auto;
        flex-grow: 1;
        display: flex;
        flex: 1;
      }

      /* ─── Focus Styles (WCAG 2.4.7 + 2.4.11) ───────────── */
      :focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 2px;
        border-radius: 4px;
      }

      /* Remove default focus for mouse users */
      :focus:not(:focus-visible) {
        outline: none;
      }

      /* ─── Skip Link Enhancement ─────────────────────────── */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 16px;
        z-index: 99999;
        padding: 12px 24px;
        background: var(--color-accent);
        color: #fff;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 14px;
        text-decoration: none;
        border-radius: 0 0 var(--radius-md) var(--radius-md);
        box-shadow: 0 4px 12px rgba(20, 184, 166, 0.4);
        transition: top 0.15s ease;
      }
      .skip-link:focus {
        top: 0;
      }

      /* ─── Scrollbar Styling (dark theme) ────────────────── */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--color-bg-root);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--color-border-strong);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--color-accent);
      }

      /* ─── Selection ──────────────────────────────────────── */
      ::selection {
        background: rgba(20, 184, 166, 0.3);
        color: #fff;
      }

      /* ─── Reduced Motion (WCAG 2.3.3) ───────────────────── */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* ─── Subtle Animations ─────────────────────────────── */
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes shimmer {
        from { background-position: -200% 0; }
        to   { background-position: 200% 0; }
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 8px rgba(20, 184, 166, 0.2); }
        50%      { box-shadow: 0 0 24px rgba(20, 184, 166, 0.5); }
      }

      @keyframes grain {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-2%, -3%); }
        30% { transform: translate(3%, 2%); }
        50% { transform: translate(-1%, 3%); }
        70% { transform: translate(2%, -1%); }
        90% { transform: translate(-3%, 1%); }
      }

      /* ─── Design Spells ─────────────────────────────────── */

      /* Noise texture overlay — adds industrial depth */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 9998;
        pointer-events: none;
        opacity: 0.025;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-size: 256px 256px;
        animation: grain 8s steps(10) infinite;
      }

      /* Entrance stagger for main content children */
      #root > * > * > [role="main"] > * {
        animation: fadeInUp 0.5s ease-out both;
      }
      #root > * > * > [role="main"] > *:nth-child(1) { animation-delay: 0.05s; }
      #root > * > * > [role="main"] > *:nth-child(2) { animation-delay: 0.1s; }
      #root > * > * > [role="main"] > *:nth-child(3) { animation-delay: 0.15s; }
      #root > * > * > [role="main"] > *:nth-child(4) { animation-delay: 0.2s; }
      #root > * > * > [role="main"] > *:nth-child(5) { animation-delay: 0.25s; }
      #root > * > * > [role="main"] > *:nth-child(n+6) { animation-delay: 0.3s; }

      /* Magnetic hover on CTA buttons — nunca em botões desativados */
      button[role="button"]:not(:disabled) {
        transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                    box-shadow 0.25s ease,
                    filter 0.25s ease;
        will-change: transform;
      }
      button[role="button"]:not(:disabled):hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
      }
      button[role="button"]:not(:disabled):active {
        transform: translateY(0) scale(0.98);
        transition-duration: 0.08s;
      }

      /* Utility Classes */
      .animate-fade-in {
        animation: fadeInUp 0.4s ease-out both;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="background-color:#0B1120;color:#F1F5F9;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;">
        <div style="text-align:center;max-width:400px;padding:24px;">
          <p style="font-size:18px;line-height:28px;margin-bottom:16px;">JavaScript é necessário para usar o QA Accessibility.</p>
          <p style="font-size:14px;color:#94A3B8;line-height:22px;">Por favor, habilite o JavaScript nas configurações do seu navegador e recarregue a página.</p>
          <a href="" style="display:inline-block;margin-top:20px;background:#14B8A6;color:#fff;padding:10px 24px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;">Recarregar</a>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
  </body>
</html>
